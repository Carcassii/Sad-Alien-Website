<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Snow‑Globe Diorama</title>
  <style>
    body{margin:0;overflow:hidden;background:#000;color:#fff;font-family:sans-serif;}
    #app{position:fixed;inset:0;}
    canvas{display:block;}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font-size:20px;}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">Loading…</div>

  <!-- Use script tags with src instead of dynamic import -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    const loading = document.getElementById('loading');
    const app = document.getElementById('app');

    // Basic setup
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0,2,6);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.85);
    composer.addPass(bloomPass);

    // Simple globe
    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(2, 64, 64),
      new THREE.MeshPhysicalMaterial({color:0x88ccff, transmission:1, thickness:0.2})
    );
    scene.add(globe);

    const light = new THREE.DirectionalLight(0xffffff,1);
    light.position.set(5,5,5);
    scene.add(light);

    // Animate
    function animate(){
      requestAnimationFrame(animate);
      globe.rotation.y += 0.002;
      controls.update();
      composer.render();
    }
    animate();

    loading.remove();

    window.addEventListener('resize',()=>{
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
